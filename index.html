    <meta name="theme-color" content="#EFE9D9" />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/susana headshot.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vestige Photography" />

    <meta name="twitter:image" content="/susana headshot.webp" />

    <title>Vestige Photography</title>

    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800;1,900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vestige Fine Art Photography",
        "url": "https://vestigefineart.com/",
        "logo": "https://vestigefineart.com/hero.webp",
        "description": "Twenty years of editorial, pin-up, lifestyle, and music photography by Susana Andrea.",
        "founder": { "@type": "Person", "name": "Susana Andrea" },
        "sameAs": [
          "https://instagram.com/vestige",
          "https://facebook.com/vestige"
        ]
      }
    </script>

    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; min-height: 100vh; min-height: 100dvh; background: #EFE9D9; color: #1A1A1B; overflow-y: auto; overflow-x: hidden; }
      #root { width: 100%; min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
